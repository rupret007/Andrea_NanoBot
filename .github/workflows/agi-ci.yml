name: AGI Layer CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

env:
  TZ: America/Chicago

permissions:
  actions: read
  contents: read

jobs:
  agi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck (AGI tests)
        run: npm run typecheck:agi
      - name: Lint (AGI tree only)
        run: npm run lint -- src/agi-core src/memory src/models src/integrations src/safety src/reflection
      - name: Format check
        run: npm run format:check
      - name: Test (AGI subset)
        run: npm run test:agi
      - name: Audit (npm)
        run: npm audit --audit-level=high

  # Keep this job id stable: GitHub keys the repository's existing CodeQL
  # baseline to `.github/workflows/agi-ci.yml:build`.
  build:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Codeql init
        uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
        with:
          languages: javascript-typescript
      - name: Codeql analyze
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
